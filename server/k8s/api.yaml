apiVersion: v1
kind: ConfigMap
metadata:
  name: ricoz-api-config
data:
  NODE_ENV: production
  PORT: "4000"
  SCHEDULERS_ENABLED: "false"
  CHAT_EMBEDDED_WORKER: "false"
  COMPLIANCE_WORKER_ENABLED: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ricoz-api
  labels:
    app: ricoz-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ricoz-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ricoz-api
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ricoz-api
      containers:
        - name: api
          image: REPLACE_WITH_ECR_IMAGE_URI
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: ricoz-api-config
            - secretRef:
                name: ricoz-api-env
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: ricoz-api
  labels:
    app: ricoz-api
spec:
  type: ClusterIP
  selector:
    app: ricoz-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ricoz-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ricoz-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ricoz-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ricoz-api
